[package]
name = "ocs_pointcloud"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded LAS/LAZ I/O and classification editing for Open CAD Studio"

[dependencies]
las = { version = "0.11.0", features = ["laz-parallel"] }
# Raw record streaming for the urban classifier's extra-byte-preserving write.
laz = "0.12"
proj4rs = { version = "0.1.10", features = ["crs-definitions"] }
crs-definitions = "0.4.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
e57 = { version = "0.11.13", features = ["crc32c"] }

# Delaunay triangulation for the ground TIN and contour generation.
delaunator = "1.1"
